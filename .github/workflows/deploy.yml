name: CI/CD Shiftcore OT Dashboard

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: shiftcore-ci
  # Commit mới nhất sẽ hủy bỏ workflow đang chờ/xếp hàng — luôn deploy bản mới nhất
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build + Deploy
    # Runner repo này tên "shiftcore_runner" (thư mục ~/germton_services/ac-rn-shiftcore),
    # chỉ có label mặc định self-hosted/linux/x64 — KHÔNG có label "ac-rn-shiftcore".
    runs-on: [ self-hosted, linux, x64 ]
    timeout-minutes: 20
    env:
      DEPLOY_DIR: /home/germton/germton_services/shiftcore

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui-src/package-lock.json

      # ---------- CI: build + typecheck (mọi lần) ----------
      - name: Install UI dependencies
        working-directory: ui-src
        run: npm ci

      - name: Typecheck
        working-directory: ui-src
        run: npm run typecheck

      - name: Build UI (vite → dist/)
        working-directory: ui-src
        run: npm run build

      # ---------- CD: chỉ khi push master ----------
      - name: Sync source sang production
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'node_modules/' \
            --exclude 'cache/' \
            --exclude 'logs/' \
            "$GITHUB_WORKSPACE/" "$DEPLOY_DIR/"

      - name: Install production dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: ${{ env.DEPLOY_DIR }}
        run: npm ci --omit=dev

      - name: Restart service (PM2 startOrReload)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: ${{ env.DEPLOY_DIR }}
        run: pm2 startOrReload ecosystem.config.cjs --update-env
