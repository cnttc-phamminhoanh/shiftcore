name: CI/CD Shiftcore OT Dashboard

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: shiftcore-ci
  # Commit mới nhất sẽ hủy bỏ workflow đang chờ/xếp hàng — luôn deploy bản mới nhất
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build + Deploy
    # Runner repo này tên "shiftcore_runner" (thư mục ~/germton_services/ac-rn-shiftcore),
    # chỉ có label mặc định self-hosted/linux/x64 — KHÔNG có label "ac-rn-shiftcore".
    runs-on: [ self-hosted, linux, x64 ]
    timeout-minutes: 20
    env:
      DEPLOY_DIR: /home/germton/germton_services/shiftcore

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          # Node 22: better-sqlite3@13 yêu cầu node >= 22 — với node 20 (trước
          # đây) npm không có prebuilt → node-gyp rebuild → thiếu make → fail.
          # Node 22 có prebuilt cho better-sqlite3 → npm ci không cần biên dịch.
          node-version: 22
          cache: npm
          cache-dependency-path: ui-src/package-lock.json

      # ---------- CI: build + typecheck (mọi lần) ----------
      - name: Install UI dependencies
        working-directory: ui-src
        run: npm ci

      - name: Typecheck
        working-directory: ui-src
        run: npm run typecheck

      - name: Build UI (vite → dist/)
        working-directory: ui-src
        run: npm run build

      - name: Copy UI build vào public/
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: ui-src
        run: |
          rm -rf ../public
          mkdir -p ../public
          cp -r dist/. ../public/

      # ---------- CD: chỉ khi push master ----------
      - name: Sync source sang production
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'node_modules/' \
            --exclude 'cache/' \
            --exclude 'logs/' \
            "$GITHUB_WORKSPACE/" "$DEPLOY_DIR/"

      - name: Check native build tools (make/g++) — better-sqlite3 cần biên dịch
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if command -v make >/dev/null 2>&1 && command -v g++ >/dev/null 2>&1; then
            echo "build tools: OK"
          else
            echo "Thiếu build tools. build-essential"
            exit 1
          fi

      - name: Install production dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: ${{ env.DEPLOY_DIR }}
        run: npm ci --omit=dev

      - name: Restart service (PM2 startOrReload)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: ${{ env.DEPLOY_DIR }}
        run: pm2 startOrReload ecosystem.config.cjs --update-env
